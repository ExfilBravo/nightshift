<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- Nightshift app icon: an amber crescent (the theme's accent) over level bars, on the
       app's dark panel colours. Rendered to icon.png for CMake's ICON_BIG. -->
  <defs>
    <linearGradient id="tile" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#2a3044"/>
      <stop offset="1" stop-color="#0f1116"/>
    </linearGradient>
    <radialGradient id="glow" cx="0.42" cy="0.44" r="0.5">
      <stop offset="0" stop-color="#ffa94d" stop-opacity="0.30"/>
      <stop offset="1" stop-color="#ffa94d" stop-opacity="0"/>
    </radialGradient>
    <linearGradient id="moon" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#ffd08a"/>
      <stop offset="1" stop-color="#ff8f3a"/>
    </linearGradient>
    <linearGradient id="bar" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#a9b2ff"/>
      <stop offset="1" stop-color="#6f7cf0"/>
    </linearGradient>
    <mask id="crescent">
      <circle cx="430" cy="480" r="300" fill="#fff"/>
      <circle cx="560" cy="380" r="250" fill="#000"/>
      <!-- a gap round the bars where they cross the moon's tip -->
      <rect x="600" y="538" width="108" height="264" rx="54" fill="#000"/>
      <rect x="700" y="418" width="108" height="384" rx="54" fill="#000"/>
    </mask>
    <clipPath id="tileClip">
      <rect x="48" y="48" width="928" height="928" rx="210"/>
    </clipPath>
  </defs>

  <rect x="48" y="48" width="928" height="928" rx="210" fill="url(#tile)"/>
  <g clip-path="url(#tileClip)">
    <rect x="48" y="48" width="928" height="928" fill="url(#glow)"/>
  </g>
  <rect x="52" y="52" width="920" height="920" rx="206" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="8"/>

  <rect x="0" y="0" width="1024" height="1024" fill="url(#moon)" mask="url(#crescent)"/>

  <rect x="622" y="560" width="64" height="220" rx="32" fill="url(#bar)"/>
  <rect x="722" y="440" width="64" height="340" rx="32" fill="url(#bar)"/>
  <rect x="822" y="610" width="64" height="170" rx="32" fill="url(#bar)"/>
</svg>
