<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<title>Nightshift UI mockup</title>
<!-- Design mockup for Nightshift's own look (not FL's). Render with headless Edge at 1600x940:
     ?layout=dock&tab=steps | ?layout=dock&tab=piano | ?layout=float -->
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<style>
:root {
  /* Night neutrals: blue-black, each layer one step lighter */
  --bg: #08090e;
  --s1: #0f1219;
  --s2: #151922;
  --s3: #1c212c;
  --s4: #252b38;
  --line: rgba(255, 255, 255, 0.055);
  --line2: rgba(255, 255, 255, 0.095);
  --t1: #e9ecf4;
  --t2: #a3aabc;
  --t3: #687087;

  /* One brand light (the moon's amber), one selection colour, and the semantic ones */
  --amber: #ffb054;
  --peri: #8f9bff;
  --rec: #ff5a6a;
  --ok: #6fdc8c;

  --r-panel: 12px;
  --r-ctl: 8px;
}

* { box-sizing: border-box; margin: 0; padding: 0; }
html, body { width: 1600px; height: 940px; overflow: hidden; background: var(--bg); }
body {
  color: var(--t1);
  font: 500 13px/1.3 Inter, "Segoe UI Variable Text", "Segoe UI", sans-serif;
  font-feature-settings: "cv11", "ss01";
  -webkit-font-smoothing: antialiased;
}
.num { font-variant-numeric: tabular-nums; }
svg.i { width: 18px; height: 18px; fill: none; stroke: currentColor; stroke-width: 1.8; stroke-linecap: round; stroke-linejoin: round; flex: none; }
svg.i.s { width: 15px; height: 15px; }

/* ---------- Top bar ---------- */
.top {
  height: 60px; display: flex; align-items: center; gap: 18px; padding: 0 16px;
}
.brand { display: flex; align-items: center; gap: 10px; width: 232px; }
.brand svg { width: 28px; height: 28px; }
.brand .word { font-weight: 650; font-size: 15px; letter-spacing: -0.01em; }
.brand .proj { color: var(--t3); font-size: 12.5px; display: flex; align-items: center; gap: 6px; }
.brand .proj::before { content: ""; width: 1px; height: 16px; background: var(--line2); margin-right: 4px; }

.seg { display: flex; background: var(--s2); border: 1px solid var(--line); border-radius: 9px; padding: 3px; gap: 2px; }
.seg button { all: unset; padding: 5px 12px; border-radius: 6px; color: var(--t2); font-size: 12.5px; font-weight: 550; }
.seg button.on { background: var(--s4); color: var(--t1); box-shadow: 0 1px 0 rgba(255,255,255,.06) inset, 0 1px 2px rgba(0,0,0,.4); }

.transport { display: flex; align-items: center; gap: 4px; background: var(--s2); border: 1px solid var(--line); border-radius: 11px; padding: 4px; }
.ib { all: unset; width: 34px; height: 34px; border-radius: var(--r-ctl); display: grid; place-items: center; color: var(--t2); }
.ib.sm { width: 28px; height: 28px; border-radius: 7px; }
.ib.on { color: var(--t1); background: var(--s4); }
.ib.play.on { background: var(--amber); color: #1b1206; }
.ib.rec { color: var(--rec); }
.ib.tog.on { color: var(--peri); background: rgba(143,155,255,.14); }
.vsep { width: 1px; height: 20px; background: var(--line2); margin: 0 4px; }

.readouts { display: flex; align-items: stretch; background: var(--s2); border: 1px solid var(--line); border-radius: 11px; height: 44px; }
.ro { display: flex; flex-direction: column; justify-content: center; padding: 0 14px; border-left: 1px solid var(--line); }
.ro:first-child { border-left: 0; }
.ro label { font-size: 9.5px; font-weight: 600; letter-spacing: .08em; text-transform: uppercase; color: var(--t3); }
.ro b { font-size: 17px; font-weight: 600; letter-spacing: -0.01em; }
.ro b small { font-size: 11px; color: var(--t3); font-weight: 500; margin-left: 2px; }
.ro.pos b { color: var(--amber); }

.right { margin-left: auto; display: flex; align-items: center; gap: 10px; }
.pill { display: flex; align-items: center; gap: 7px; height: 30px; padding: 0 11px; border-radius: 999px; background: rgba(111,220,140,.10); color: #a6ecb9; font-size: 12px; font-weight: 550; border: 1px solid rgba(111,220,140,.18); }
.pill i { width: 7px; height: 7px; border-radius: 50%; background: var(--ok); box-shadow: 0 0 8px var(--ok); }
.cpu { color: var(--t3); font-size: 12px; }
.cpu b { color: var(--t2); font-weight: 600; }
.mmeter { width: 96px; display: grid; gap: 3px; }
.mmeter span { height: 4px; border-radius: 2px; background: var(--s3); position: relative; overflow: hidden; }
.mmeter span::after { content: ""; position: absolute; inset: 0; width: var(--w); border-radius: 2px; background: linear-gradient(90deg, #4fd18a, #b8e35a 70%, #ffcf5a); }
.btn { all: unset; height: 32px; padding: 0 13px; border-radius: var(--r-ctl); display: flex; align-items: center; gap: 7px; background: var(--s3); border: 1px solid var(--line2); color: var(--t1); font-size: 12.5px; font-weight: 550; }

/* ---------- Panels ---------- */
.main { position: absolute; top: 60px; left: 0; right: 0; bottom: 0; padding: 0 8px 8px; }
.panel { background: var(--s1); border: 1px solid var(--line); border-radius: var(--r-panel); overflow: hidden; position: relative; }
.phead { height: 44px; display: flex; align-items: center; gap: 10px; padding: 0 12px 0 14px; border-bottom: 1px solid var(--line); }
.phead h2 { font-size: 13px; font-weight: 650; }
.phead .sub { color: var(--t3); font-size: 12px; }
.phead .grow { flex: 1; }
.chip { display: inline-flex; align-items: center; gap: 7px; height: 28px; padding: 0 9px 0 8px; border-radius: 7px; background: var(--s2); border: 1px solid var(--line2); font-size: 12.5px; font-weight: 550; color: var(--t1); }
.chip i { width: 9px; height: 9px; border-radius: 3px; background: var(--c); }
.chip svg { color: var(--t3); }
.tools { display: flex; gap: 2px; background: var(--s2); border: 1px solid var(--line); border-radius: 8px; padding: 2px; }
.tools .ib { width: 28px; height: 26px; border-radius: 6px; }
.tabs { display: flex; gap: 4px; height: 100%; align-items: stretch; }
.tabs span { display: flex; align-items: center; padding: 0 10px; color: var(--t3); font-weight: 600; font-size: 13px; border-bottom: 2px solid transparent; margin-bottom: -1px; }
.tabs span.on { color: var(--t1); border-color: var(--amber); }
.tabs span.soon::after { content: "soon"; font-size: 9.5px; font-weight: 600; color: var(--t3); background: var(--s3); border-radius: 4px; padding: 1px 5px; margin-left: 6px; letter-spacing: .03em; }
.mini { display: flex; align-items: center; gap: 8px; color: var(--t3); font-size: 12px; }
.mini .bar { width: 72px; height: 4px; border-radius: 2px; background: var(--s3); position: relative; }
.mini .bar::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: var(--w); border-radius: 2px; background: var(--t2); }
.mini .bar::before { content: ""; position: absolute; left: calc(var(--w) - 5px); top: -3px; width: 10px; height: 10px; border-radius: 50%; background: var(--t1); box-shadow: 0 1px 3px rgba(0,0,0,.6); }

/* ---------- Dock layout ---------- */
.dock .main { display: grid; grid-template-columns: 252px 1fr; grid-template-rows: 1fr 396px; gap: 8px; }
.dock .sidebar { grid-row: 1 / 3; }
.float .sidebar { display: none; }
.float .main { display: block; }
.float .arrange { position: absolute; inset: 0 8px 8px 8px; }

/* ---------- Sidebar ---------- */
.sidebar { display: flex; flex-direction: column; }
.sec { padding: 12px 10px 6px; }
.sec h3 { display: flex; align-items: center; justify-content: space-between; font-size: 10px; font-weight: 650; letter-spacing: .09em; text-transform: uppercase; color: var(--t3); padding: 0 6px 8px; }
.sec h3 svg { color: var(--t3); }
.prow { display: flex; align-items: center; gap: 10px; height: 38px; padding: 0 8px; border-radius: 8px; color: var(--t2); }
.prow.on { background: rgba(143,155,255,.12); color: var(--t1); box-shadow: inset 0 0 0 1px rgba(143,155,255,.28); }
.prow .sw { width: 10px; height: 10px; border-radius: 3px; background: var(--c); box-shadow: 0 0 0 3px color-mix(in srgb, var(--c) 18%, transparent); margin: 0 3px 0 2px; }
.prow .n { font-weight: 550; flex: 1; }
.prow .len { color: var(--t3); font-size: 11.5px; }
.search { margin: 4px 6px 10px; height: 32px; border-radius: 8px; background: var(--s2); border: 1px solid var(--line2); display: flex; align-items: center; gap: 8px; padding: 0 10px; color: var(--t3); font-size: 12.5px; white-space: nowrap; }
.search kbd { margin-left: auto; font: 600 10.5px Inter, sans-serif; color: var(--t3); border: 1px solid var(--line2); border-radius: 5px; padding: 1px 5px; }
.grp { display: flex; align-items: center; gap: 6px; padding: 6px 8px; color: var(--t2); font-weight: 600; font-size: 12px; }
.grp svg { color: var(--t3); }
.grp .count { margin-left: auto; color: var(--t3); font-weight: 500; font-size: 11.5px; }
.srow { display: flex; align-items: center; gap: 9px; height: 30px; padding: 0 8px 0 26px; border-radius: 7px; color: var(--t2); font-size: 12.5px; }
.srow.hov { background: var(--s2); color: var(--t1); }
.srow .dot { width: 6px; height: 6px; border-radius: 50%; background: var(--c); }
.srow .tag { margin-left: auto; font-size: 10.5px; color: var(--t3); }
.sidebar .foot { margin-top: auto; padding: 10px 14px; border-top: 1px solid var(--line); color: var(--t3); font-size: 11.5px; display: flex; gap: 6px; align-items: center; }

/* ---------- Arrange ---------- */
.arrange { display: flex; flex-direction: column; }
.tl { position: relative; flex: 1; }
.ruler { position: absolute; left: 0; right: 0; top: 0; height: 30px; border-bottom: 1px solid var(--line); background: var(--s1); }
.ruler .bn { position: absolute; top: 12px; font-size: 11px; color: var(--t3); font-weight: 600; }
.ruler .tick { position: absolute; bottom: 0; width: 1px; height: 7px; background: var(--line2); }
.loop { position: absolute; top: 3px; height: 6px; border-radius: 3px; background: rgba(255,176,84,.55); }
.loopshade { position: absolute; top: 30px; bottom: 0; background: rgba(255,176,84,.035); border-left: 1px solid rgba(255,176,84,.25); border-right: 1px solid rgba(255,176,84,.25); }
.th { position: absolute; left: 0; width: 200px; border-bottom: 1px solid var(--line); border-right: 1px solid var(--line); background: var(--s1); display: flex; align-items: center; gap: 10px; padding: 0 10px 0 0; }
.th .cb { width: 3px; align-self: stretch; margin: 8px 0; border-radius: 0 3px 3px 0; background: var(--c); }
.th .nm { flex: 1; min-width: 0; }
.th .nm b { display: block; font-size: 13px; font-weight: 600; }
.th .nm span { display: flex; align-items: center; gap: 5px; color: var(--t3); font-size: 11.5px; margin-top: 2px; }
.ms { display: flex; gap: 3px; }
.ms span { width: 22px; height: 20px; border-radius: 5px; display: grid; place-items: center; font-size: 10.5px; font-weight: 700; color: var(--t3); background: var(--s2); border: 1px solid var(--line); }
.ms span.arm { color: var(--rec); border-color: rgba(255,90,106,.35); background: rgba(255,90,106,.10); }
.ms span.arm::before { content: ""; width: 8px; height: 8px; border-radius: 50%; background: var(--rec); }
.lane { position: absolute; left: 200px; right: 0; border-bottom: 1px solid var(--line); }
.lane.sub { background: rgba(0,0,0,.18); }
.thsub { position: absolute; left: 0; width: 200px; border-right: 1px solid var(--line); border-bottom: 1px solid var(--line); background: rgba(0,0,0,.18); display: flex; align-items: center; padding-left: 26px; gap: 8px; color: var(--t3); font-size: 11.5px; font-weight: 550; }
.thsub.on { color: var(--t1); }
.thsub .star { width: 6px; height: 6px; border-radius: 50%; background: var(--amber); }
.gridv { position: absolute; top: 30px; bottom: 0; width: 1px; background: var(--line); }
.gridv.beat { background: rgba(255,255,255,.025); }
.clip { position: absolute; border-radius: 6px; background: color-mix(in srgb, var(--c) 17%, var(--s2)); border: 1px solid color-mix(in srgb, var(--c) 50%, transparent); overflow: hidden; }
.clip .lbl { position: absolute; left: 7px; top: 3px; font-size: 10.5px; font-weight: 650; color: color-mix(in srgb, var(--c) 70%, white); white-space: nowrap; z-index: 1; }
.clip svg { position: absolute; left: 0; top: 0; width: 100%; height: 100%; }
.clip.sel { box-shadow: 0 0 0 1.5px var(--peri); }
.playhead { position: absolute; top: 0; bottom: 0; width: 2px; background: var(--amber); box-shadow: 0 0 10px rgba(255,176,84,.6); }
.playhead::before { content: ""; position: absolute; top: 18px; left: -5px; width: 12px; height: 12px; border-radius: 3px; transform: rotate(45deg); background: var(--amber); }

/* ---------- Steps ---------- */
.steps { padding: 6px 12px 0 0; }
.shead { height: 24px; display: flex; align-items: center; color: var(--t3); font-size: 10.5px; font-weight: 600; }
.srow2 { height: 35px; display: flex; align-items: center; }
.srow2 .who { width: 186px; display: flex; align-items: center; gap: 9px; padding-left: 14px; }
.srow2 .who i { width: 3px; height: 22px; border-radius: 2px; background: var(--c); }
.srow2 .who b { font-size: 12.5px; font-weight: 600; flex: 1; }
.srow2 .who em { font-style: normal; color: var(--t3); font-size: 10.5px; }
.srow2 .who.sel b { color: var(--t1); }
.srow2.sel { background: linear-gradient(90deg, rgba(143,155,255,.10), rgba(143,155,255,0) 60%); }
.vol { width: 74px; display: grid; gap: 4px; padding: 0 12px 0 6px; }
.vol span { height: 4px; border-radius: 2px; background: var(--s3); position: relative; }
.vol span::after { content: ""; position: absolute; left: 0; top: 0; bottom: 0; width: var(--w); border-radius: 2px; background: color-mix(in srgb, var(--t2) 80%, transparent); }
.vol span.pan::after { left: var(--l); width: var(--pw); background: var(--peri); }
.vol span.pan::before { content: ""; position: absolute; left: 50%; top: -2px; width: 1px; height: 8px; background: var(--t3); }
.pads { display: flex; gap: 4px; }
.pads .gap { width: 8px; }
.pad { width: 40px; height: 27px; border-radius: 6px; background: var(--s3); position: relative; overflow: hidden; }
.pad.beat1 { background: #20253100; background: var(--s3); }
.pad.on { background: color-mix(in srgb, var(--c) calc(var(--v) * 100%), var(--s3)); box-shadow: inset 0 1px 0 rgba(255,255,255,.18); }
.pad.now { background: #262833; box-shadow: inset 0 -2px 0 rgba(255,176,84,.7); }
.pad.on.now { background: color-mix(in srgb, var(--c) calc(var(--v) * 100%), white 12%); box-shadow: inset 0 -2px 0 rgba(255,176,84,.95), 0 0 12px color-mix(in srgb, var(--c) 50%, transparent); }
.card .srow2 .who { width: 132px; }
.card .shead > span:first-child { width: 132px !important; }
.card .pad { width: 33px; }
.card .pads { gap: 3px; }
.card .pads .gap { width: 6px; }
.card .colnum { width: 33px; }
.card .noteprev { width: 590px; }
.card .shead > span:nth-child(2) { white-space: nowrap; }
.pad .vb { position: absolute; left: 0; right: 0; bottom: 0; height: calc(var(--v) * 100%); }
.lvl { width: 6px; height: 22px; border-radius: 3px; background: var(--s3); margin-left: 14px; position: relative; overflow: hidden; }
.lvl::after { content: ""; position: absolute; left: 0; right: 0; bottom: 0; height: var(--h); background: linear-gradient(0deg, #4fd18a, #b8e35a); }
.noteprev { width: 704px; height: 27px; border-radius: 6px; background: var(--s2); border: 1px dashed var(--line2); display: flex; align-items: center; justify-content: center; color: var(--t3); font-size: 11.5px; }
.colnum { width: 40px; text-align: center; }

/* ---------- Piano roll ---------- */
.pr { position: absolute; left: 0; right: 0; bottom: 0; }
.keys { position: absolute; left: 0; top: 0; width: 58px; }
.key { position: absolute; left: 0; right: 0; border-bottom: 1px solid var(--bg); }
.key.w { background: #2b3141; }
.key.b { background: #12151c; right: 22px; border-radius: 0 3px 3px 0; z-index: 2; }
.key.c::after { content: attr(data-n); position: absolute; right: 6px; top: 50%; transform: translateY(-50%); font-size: 9.5px; font-weight: 650; color: var(--t3); }
.prgrid { position: absolute; left: 58px; right: 0; top: 0; }
.prrow { position: absolute; left: 0; right: 0; }
.prrow.b { background: rgba(0,0,0,.22); }
.prrow.c { border-bottom: 1px solid rgba(255,255,255,.06); }
.note { position: absolute; border-radius: 4px; background: color-mix(in srgb, var(--c) calc(55% + var(--v) * 45%), var(--s2)); box-shadow: inset 0 1px 0 rgba(255,255,255,.22), 0 0 0 1px rgba(0,0,0,.35); }
.note.sel { box-shadow: inset 0 1px 0 rgba(255,255,255,.22), 0 0 0 1.5px #fff; }
.note.ghost { background: transparent; box-shadow: inset 0 0 0 1px color-mix(in srgb, var(--c) 45%, transparent); }
.vlane { position: absolute; left: 58px; right: 0; bottom: 0; border-top: 1px solid var(--line); background: rgba(0,0,0,.15); }
.vstem { position: absolute; bottom: 8px; width: 2px; border-radius: 1px; background: var(--c); opacity: .85; }
.vstem::before { content: ""; position: absolute; top: -4px; left: -3px; width: 8px; height: 8px; border-radius: 50%; background: var(--c); }
.vlbl { position: absolute; left: 0; bottom: 0; width: 58px; color: var(--t3); font-size: 9.5px; font-weight: 650; letter-spacing: .08em; display: flex; align-items: flex-start; justify-content: center; padding-top: 8px; }
.prruler { position: absolute; left: 58px; right: 0; top: 0; height: 24px; border-bottom: 1px solid var(--line); }
.prruler .bn { position: absolute; top: 6px; font-size: 10.5px; color: var(--t3); font-weight: 600; }

/* ---------- Floating cards (layout B) ---------- */
.card { position: absolute; background: var(--s1); border: 1px solid var(--line2); border-radius: 14px; overflow: hidden; box-shadow: 0 28px 70px rgba(0,0,0,.6), 0 2px 8px rgba(0,0,0,.4); }
.card .phead { cursor: grab; }
.card .close { margin-left: 4px; color: var(--t3); }

.note-tag { position: absolute; right: 18px; bottom: 14px; font-size: 11px; color: var(--t3); }
</style>
</head>
<body>
<div id="app"></div>
<script>
const params = new URLSearchParams(location.search);
const layout = params.get('layout') || 'dock';
const tab = params.get('tab') || 'steps';
document.body.className = layout;

// ---------- Icons ----------
const P = {
  stop: '<rect x="6.5" y="6.5" width="11" height="11" rx="2" fill="currentColor" stroke="none"/>',
  play: '<path d="M8.5 5.8v12.4a.8.8 0 0 0 1.2.7l10-6.2a.8.8 0 0 0 0-1.4l-10-6.2a.8.8 0 0 0-1.2.7z" fill="currentColor" stroke="none"/>',
  rec: '<circle cx="12" cy="12" r="6" fill="currentColor" stroke="none"/>',
  loop: '<path d="M17 3l3 3-3 3"/><path d="M4 12V10a4 4 0 0 1 4-4h12"/><path d="M7 21l-3-3 3-3"/><path d="M20 12v2a4 4 0 0 1-4 4H4"/>',
  metro: '<path d="M9 3.5h6l3.8 16.5H5.2z"/><path d="M12 16l5.5-9"/><path d="M8 15h8"/>',
  sliders: '<path d="M4 7h9M17 7h3M4 17h3M11 17h9"/><circle cx="15" cy="7" r="2"/><circle cx="9" cy="17" r="2"/>',
  export: '<path d="M12 4v11"/><path d="M7.5 10.5L12 15l4.5-4.5"/><path d="M5 20h14"/>',
  down: '<path d="M7 10l5 5 5-5"/>',
  right: '<path d="M10 7l5 5-5 5"/>',
  plus: '<path d="M12 5v14M5 12h14"/>',
  search: '<circle cx="11" cy="11" r="6.5"/><path d="M20 20l-4.2-4.2"/>',
  pointer: '<path d="M6 4l12.5 7.2-5.6 1.7-2.4 5.6z"/>',
  pencil: '<path d="M4.5 19.5l3.8-.9L19 7.9a2 2 0 0 0 0-2.8l-.1-.1a2 2 0 0 0-2.8 0L5.4 15.7z"/>',
  eraser: '<path d="M8 20h11"/><path d="M4.6 14.6l9.2-9.2a2 2 0 0 1 2.8 0l2 2a2 2 0 0 1 0 2.8L11 18.8H8.8z"/>',
  scissors: '<circle cx="6.5" cy="17.5" r="2.5"/><circle cx="17.5" cy="17.5" r="2.5"/><path d="M8.3 15.7L18 5M15.7 15.7L6 5"/>',
  wave: '<path d="M3 12h2.5l2.5-6 4 12 3-9 2 3H21"/>',
  grid: '<rect x="4" y="4" width="6" height="6" rx="1.5"/><rect x="14" y="4" width="6" height="6" rx="1.5"/><rect x="4" y="14" width="6" height="6" rx="1.5"/><rect x="14" y="14" width="6" height="6" rx="1.5"/>',
  keys: '<rect x="3.5" y="5" width="17" height="14" rx="2.5"/><path d="M8.5 5v8M12 5v8M15.5 5v8"/>',
  plug: '<path d="M9 3v5M15 3v5"/><path d="M6.5 8h11v3a5.5 5.5 0 0 1-11 0z"/><path d="M12 16.5V21"/>',
  folder: '<path d="M3.5 7.5a2 2 0 0 1 2-2h4l2 2h7a2 2 0 0 1 2 2v7a2 2 0 0 1-2 2h-13a2 2 0 0 1-2-2z"/>',
  close: '<path d="M7 7l10 10M17 7L7 17"/>',
  expand: '<path d="M4 9V4h5M20 15v5h-5M15 4h5v5M9 20H4v-5"/>',
  mic: '<rect x="9" y="3.5" width="6" height="11" rx="3"/><path d="M5.5 11.5a6.5 6.5 0 0 0 13 0M12 18v3"/>',

const keysNotes = [[0,216,49,92],[5,211,60,80],[10,206,63,77],[15,201,65,74],[20,196,68,71],[240,136,60,66],[242,136,63,66],[244,136,65,66],[246,136,68,66],[384,216,48,92],[389,211,58,80],[394,206,62,77],[399,201,63,74],[404,196,67,71],[624,136,58,66],[626,136,62,66],[628,136,63,66],[630,136,67,66],[768,216,46,92],[773,211,56,80],[778,206,60,77],[783,201,61,74],[788,196,65,71],[1008,136,56,66],[1010,136,60,66],[1012,136,61,66],[1014,136,65,66],[1152,216,41,92],[1157,211,56,80],[1162,206,60,77],[1167,201,63,74],[1172,196,67,71],[1392,136,56,66],[1394,136,60,66],[1396,136,63,66],[1398,136,67,66]];

const bassNotes = [[0,150,37],[168,64,37],[240,130,37],[384,150,36],[552,64,36],[624,130,36],[768,150,34],[936,64,34],[1008,130,34],[1152,150,41],[1320,64,41],[1392,130,44]];

// Seeded noise for waveforms
function rng(seed) { return () => { seed |= 0; seed = seed + 0x6D2B79F5 | 0; let t = Math.imul(seed ^ seed >>> 15, 1 | seed); t = t + Math.imul(t ^ t >>> 7, 61 | t) ^ t; return ((t ^ t >>> 14) >>> 0) / 4294967296; }; }
function wavePath(w, h, seed, top = 0) {
  const r = rng(seed); const mid = top + h / 2; let up = '', dn = '';
  for (let x = 0; x <= w; x += 2) {
    const beat = (x % 46) / 46; const env = 0.25 + 0.75 * Math.exp(-beat * 3.2);
    const a = (h / 2 - 1) * env * (0.55 + 0.45 * r());
    up += `${x},${(mid - a).toFixed(1)} `; dn = `${x},${(mid + a).toFixed(1)} ` + dn;
  }
  return `M${up}L${dn}Z`;
}

// ---------- Arrange ----------
function arrange(width, height, opts = {}) {
  const head = 200, rulerH = 30, bars = 16;
  const ppb = (width - head) / bars;           // px per bar
  const x = bar => head + (bar - 1) * ppb;     // bar is 1-based
  const tracks = [
    { name: 'Keys', sub: 'Pattern track', c: PAT.keys, h: 54 },
    { name: 'Drums', sub: 'Pattern track', c: PAT.beat, h: 54 },
    { name: '808', sub: 'Pattern track', c: PAT.b808, h: 54 },
    { name: 'Guitar', sub: 'Audio · In 1', c: PAT.guitar, h: 54, audio: true, takes: 4 },
  ];
  let html = '', y = rulerH;

  // Grid lines
  for (let b = 1; b <= bars + 1; ++b) {
    html += `<div class="gridv" style="left:${x(b)}px"></div>`;
    for (let q = 1; q < 4; ++q) html += `<div class="gridv beat" style="left:${x(b) + q * ppb / 4}px"></div>`;
  }
  html += `<div class="loopshade" style="left:${x(5)}px;width:${4 * ppb}px"></div>`;

  // Ruler
  let ruler = `<div class="ruler">`;
  for (let b = 1; b <= bars; ++b) ruler += `<span class="bn" style="left:${x(b) + 6}px">${b}</span><span class="tick" style="left:${x(b)}px;height:12px"></span>`;
  ruler += `<div class="loop" style="left:${x(5) + 1}px;width:${4 * ppb - 2}px"></div></div>`;

  const clip = (c, bar, len, top, h, label, inner = '', cls = '') =>
    `<div class="clip ${cls}" style="--c:${c};left:${x(bar) + 1}px;top:${top + 4}px;width:${len * ppb - 2}px;height:${h - 8}px"><span class="lbl">${label}</span>${inner}</div>`;

  const midiMini = (notes, len, lo, hi, w, h, colour) => {
    const sx = w / (len * 384), sy = (h - 24) / (hi - lo + 1);
    return `<svg viewBox="0 0 ${w} ${h}">${notes.map(n => `<rect x="${(n[0] * sx).toFixed(1)}" y="${(19 + (hi - n[2]) * sy).toFixed(1)}" width="${Math.max(2, n[1] * sx - 1).toFixed(1)}" height="${Math.max(1.5, sy - .5).toFixed(1)}" rx="1" fill="${colour}" opacity=".85"/>`).join('')}</svg>`;
  };
  const stepMini = (w, h, colour, seed) => {
    const rows = [steps[0], steps[1], steps[3], steps[5]];
    let s = `<svg viewBox="0 0 ${w} ${h}">`;
    rows.forEach((r, i) => Object.keys(r.s).forEach(k => {
      s += `<rect x="${(4 + k * (w - 8) / 16).toFixed(1)}" y="${18 + i * 7}" width="${Math.max(2, (w - 8) / 16 - 2).toFixed(1)}" height="4" rx="1" fill="${colour}" opacity="${.5 + r.s[k] / 255}"/>`;
    }));
    return s + '</svg>';
  };

  tracks.forEach((t, i) => {
    html += `<div class="th" style="--c:${t.c};top:${y}px;height:${t.h}px"><span class="cb"></span>
      <div class="nm"><b>${t.audio ? `${icon('down', 's')}` : ''}${t.name}</b><span>${t.audio ? icon('mic', 's') : icon('grid', 's')}${t.sub}</span></div>
      <div class="ms">${t.audio ? '<span class="arm"></span>' : ''}<span>M</span><span>S</span></div></div>`;
    html += `<div class="lane" style="top:${y}px;height:${t.h}px"></div>`;
    const top = y;

    if (i == 0) [1, 5, 9].forEach(b => html += clip(PAT.keys, b, 4, top, t.h, 'Keys', midiMini(keysNotes, 4, 41, 68, 4 * ppb - 2, t.h - 8, PAT.keys)));
    if (i == 1) {
      [[5, 'Beat', PAT.beat], [6, 'Beat', PAT.beat], [7, 'Beat', PAT.beat], [8, 'Fill', PAT.fill], [9, 'Beat 2', PAT.beat2], [10, 'Beat 2', PAT.beat2], [11, 'Beat 2', PAT.beat2], [12, 'Fill', PAT.fill]]
        .forEach(([b, n, c], k) => html += clip(c, b, 1, top, t.h, n, stepMini(ppb - 2, t.h - 8, c, k), k == 0 ? 'sel' : ''));
    }
    if (i == 2) [5, 9].forEach(b => html += clip(PAT.b808, b, 4, top, t.h, '808', midiMini(bassNotes, 4, 32, 46, 4 * ppb - 2, t.h - 8, PAT.b808)));
    if (i == 3) {
      const w = 4 * ppb - 2;
      html += clip(PAT.guitar, 5, 4, top, t.h, 'Guitar · 4 takes',
        `<svg viewBox="0 0 ${w} ${t.h - 8}"><path d="${wavePath(w, t.h - 26, 7, 16)}" fill="${PAT.guitar}" opacity=".8"/></svg>`);
    }
    y += t.h;

    if (t.takes) {
      const comp = [[0, .27, 0], [.27, .56, 2], [.56, 1, 1]];
      for (let k = 0; k < t.takes; ++k) {
        const lh = 30, w = 4 * ppb - 2, used = comp.some(s => s[2] == k);
        html += `<div class="thsub ${used ? 'on' : ''}" style="top:${y}px;height:${lh}px">${used ? '<span class="star"></span>' : '<span style="width:6px"></span>'}Take ${k + 1}</div>`;
        html += `<div class="lane sub" style="top:${y}px;height:${lh}px"></div>`;
        let segs = '';
        comp.filter(s => s[2] == k).forEach(s => segs += `<rect x="${s[0] * w}" y="0" width="${(s[1] - s[0]) * w}" height="${lh}" fill="${PAT.guitar}" opacity=".22"/>`);
        const tw = k == 3 ? w * .6 : w;
        html += `<div class="clip" style="--c:${PAT.guitar};left:${x(5) + 1}px;top:${y + 3}px;width:${tw}px;height:${lh - 6}px;background:var(--s2);border-color:rgba(255,255,255,.08)">
          <svg viewBox="0 0 ${tw} ${lh - 6}">${segs}<path d="${wavePath(tw, lh - 10, 30 + k, 2)}" fill="${used ? PAT.guitar : '#59607a'}" opacity="${used ? .85 : .55}"/></svg></div>`;
        y += lh;
      }
    }
  });

  html += `<div class="playhead" style="left:${x(6.5)}px"></div>`;

  return `<section class="panel arrange" style="${opts.style || ''}">
    <div class="phead"><h2>Arrange</h2><span class="sub">16 bars · 0:43</span>
      <div class="tools" style="margin-left:10px">${['pointer', 'pencil', 'scissors', 'eraser'].map((n, k) => `<button class="ib ${k == 0 ? 'on' : ''}">${icon(n, 's')}</button>`).join('')}</div>
      <span class="chip">${icon('magnet', 's')}Bar${icon('down', 's')}</span>
      <span class="grow"></span>
      <span class="chip">${icon('plus', 's')}Track</span>
    </div>
    <div class="tl">${ruler}${html}</div>
  </section>`;
}

// ---------- Steps ----------
function stepsView() {
  let h = `<div class="steps"><div class="shead"><span style="width:186px"></span><span style="width:74px;padding-left:6px">Level / pan</span><div class="pads">`;
  for (let s = 0; s < 16; ++s) h += `${s && s % 4 == 0 ? '<span class="gap"></span>' : ''}<span class="colnum">${s % 4 == 0 ? s / 4 + 1 : '·'}</span>`;
  h += `</div></div>`;
  steps.forEach((r, i) => {
    const sel = i == 0;
    const panL = r.pan < 0 ? 50 + r.pan * 50 : 50, panW = Math.abs(r.pan) * 50;
    h += `<div class="srow2 ${sel ? 'sel' : ''}" style="--c:${r.c}">
      <div class="who ${sel ? 'sel' : ''}"><i></i><b>${r.name}</b><em>${r.type}</em></div>
      <div class="vol"><span style="--w:${r.vol * 100}%"></span><span class="pan" style="--l:${panL}%;--pw:${Math.max(panW, 1.5)}%"></span></div>`;
    if (r.type == 'Synth') {
      h += `<div class="noteprev">No notes in Beat · double-click for the piano roll</div>`;
    } else {
      h += `<div class="pads">`;
      for (let s = 0; s < 16; ++s) {
        const v = r.s[s];
        h += `${s && s % 4 == 0 ? '<span class="gap"></span>' : ''}<span class="pad ${v ? 'on' : ''} ${s == 9 ? 'now' : ''}" style="${v ? `--v:${(.45 + .55 * v / 127).toFixed(2)}` : ''}"></span>`;
      }
      h += `</div>`;
    }
    h += `<span class="lvl" style="--h:${[78, 30, 22, 46, 0, 12, 0, 0, 0][i]}%"></span></div>`;
  });
  return h + `</div>`;
}

// ---------- Piano roll ----------
function pianoView(w, h, opts = {}) {
  // Scrolled to the chords' range, at a comfortable zoom
  const lo = 46, hi = 69, kh = opts.kh || (h - 24 - 60) / (hi - lo + 1), gridW = w - 58, len = 1536, ppt = gridW / len;
  const isBlack = k => [1, 3, 6, 8, 10].includes(((k % 12) + 12) % 12);
  const y = k => 24 + (hi - k) * kh;
  let keys = '', rows = '', notes = '', ghosts = '', vel = '', ruler = '';
  for (let k = lo; k <= hi; ++k) {
    const black = isBlack(k), c = k % 12 == 0;
    rows += `<div class="prrow ${black ? 'b' : ''} ${(k % 12 == 0) ? 'c' : ''}" style="top:${y(k) - 24}px;height:${kh}px"></div>`;
    keys += `<div class="key ${black ? 'b' : 'w'} ${c ? 'c' : ''}" data-n="C${k / 12 - 0}" style="top:${y(k)}px;height:${kh}px"></div>`;
  }
  for (let b = 0; b < 4; ++b) {
    ruler += `<span class="bn" style="left:${b * 384 * ppt + 6}px">${b + 1}</span>`;
    for (let q = 0; q < 4; ++q)
      rows += `<div style="position:absolute;top:0;bottom:0;left:${(b * 384 + q * 96) * ppt}px;width:1px;background:${q == 0 ? 'rgba(255,255,255,.09)' : 'rgba(255,255,255,.035)'}"></div>`;
  }
  padNotes.forEach(n => { if (n[2] <= hi && n[2] >= lo) ghosts += `<div class="note ghost" style="--c:${C.pad};left:${n[0] * ppt}px;top:${y(n[2]) - 24 + 1}px;width:${n[1] * ppt - 2}px;height:${kh - 2}px"></div>`; });
  keysNotes.forEach((n, i) => {
    if (n[2] < lo || n[2] > hi) return;
    const v = n[3] / 127;
    notes += `<div class="note ${i == 9 ? 'sel' : ''}" style="--c:${C.keys};--v:${v.toFixed(2)};left:${n[0] * ppt}px;top:${y(n[2]) - 24 + 1}px;width:${Math.max(4, n[1] * ppt - 2)}px;height:${kh - 2}px"></div>`;
    vel += `<span class="vstem" style="--c:${C.keys};left:${n[0] * ppt + 2}px;height:${(n[3] / 127) * 40}px"></span>`;
  });
  return `<div class="pr" style="top:${opts.top || 0}px">
    <div class="prruler">${ruler}<div class="playhead" style="left:${(1.5 * 384) * ppt}px;box-shadow:none"></div></div>
    <div class="keys" style="height:${(hi - lo + 1) * kh + 24}px">${keys}</div>
    <div class="prgrid" style="top:24px;height:${(hi - lo + 1) * kh}px;overflow:hidden">${rows}${ghosts}${notes}
      <div style="position:absolute;top:0;bottom:0;width:2px;left:${1.5 * 384 * ppt}px;background:var(--amber);opacity:.9"></div></div>
    <div class="vlbl" style="height:60px">VEL</div>
    <div class="vlane" style="height:60px">${vel}</div>
  </div>`;
}

function editorHead(kind, closeable) {
  const tabs = `<div class="tabs"><span class="${kind == 'steps' ? 'on' : ''}">Steps</span><span class="${kind == 'piano' ? 'on' : ''}">Piano roll</span><span class="soon">Mixer</span></div>`;
  if (kind == 'steps')
    return `<div class="phead">${closeable ? `<h2>Steps</h2>` : tabs}
      <span class="chip" style="--c:${PAT.beat};margin-left:8px"><i></i>Beat${icon('down', 's')}</span>
      <span class="grow"></span>
      <div class="mini">Swing<span class="bar" style="--w:32%"></span><b class="num" style="color:var(--t2)">32%</b></div>
      <span class="chip">16 steps${icon('down', 's')}</span>
      ${closeable ? `<button class="ib sm close">${icon('close', 's')}</button>` : `<button class="ib sm">${icon('expand', 's')}</button>`}
    </div>`;
  return `<div class="phead">${closeable ? `<h2>Piano roll</h2>` : tabs}
    <span class="chip" style="--c:${C.keys};margin-left:8px"><i></i>Keys${icon('down', 's')}</span>
    <span class="sub">in</span><span class="chip" style="--c:${PAT.keys}"><i></i>Keys${icon('down', 's')}</span>
    <span class="grow"></span>
    <div class="tools">${['pointer', 'pencil', 'eraser'].map((n, k) => `<button class="ib ${k == 1 ? 'on' : ''}">${icon(n, 's')}</button>`).join('')}</div>
    <span class="chip">${icon('magnet', 's')}1/16${icon('down', 's')}</span>
    ${closeable ? `<button class="ib sm close">${icon('close', 's')}</button>` : `<button class="ib sm">${icon('expand', 's')}</button>`}
  </div>`;
}

// ---------- Assemble ----------
let body = topBar();
if (layout == 'dock') {
  const editor = tab == 'piano'
    ? `<section class="panel">${editorHead('piano')}${pianoView(1320 - 2, 396 - 44, { top: 44 })}</section>`
    : `<section class="panel">${editorHead('steps')}${stepsView()}</section>`;
  body += `<div class="main">${sidebar()}${arrange(1324, 400)}${editor}</div>`;
} else {
  body += `<div class="main">${arrange(1582, 870)}
    <section class="card" style="left:24px;bottom:24px;width:860px;height:420px">${editorHead('steps', true)}${stepsView()}</section>
    <section class="card" style="right:24px;bottom:56px;width:700px;height:400px">${editorHead('piano', true)}${pianoView(698, 400 - 44, { top: 44 })}</section>
  </div>`;
}
